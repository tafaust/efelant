version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    assignees:
      - tafaust
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    rebase-strategy: auto
    cooldown:
      default-days: 4
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /database
      - /database/web-gateway
      - /app
      - /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    assignees:
      - tafaust
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    rebase-strategy: auto
    cooldown:
      default-days: 4

  - package-ecosystem: npm
    directories:
      - /packages/tokens
      - /packages/ts-client
      - /packages/js-client
      - /packages/web-components
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    assignees:
      - tafaust
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    rebase-strategy: auto
    cooldown:
      default-days: 4
      semver-major-days: 14
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directories:
      - /database/web-gateway
      - /database/tests
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    assignees:
      - tafaust
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    rebase-strategy: auto
    cooldown:
      default-days: 4
      semver-major-days: 14

  - package-ecosystem: pub
    directories:
      - /app
      - /packages/flutter
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    assignees:
      - tafaust
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    rebase-strategy: auto
    cooldown:
      default-days: 4
      semver-major-days: 14

  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    assignees:
      - tafaust
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    rebase-strategy: auto
    cooldown:
      default-days: 4
      semver-major-days: 14
