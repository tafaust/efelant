version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /database
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directory: /database/web-gateway
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directory: /site
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: npm
    directory: /packages/tokens
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /packages/ts-client
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /packages/js-client
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /packages/web-components
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: /database/web-gateway
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: pip
    directory: /database/tests
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: pub
    directory: /packages/flutter
    schedule:
      interval: weekly
      day: monday
