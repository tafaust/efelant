name: GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      major: ${{ steps.ver.outputs.major }}
      minor: ${{ steps.ver.outputs.minor }}
      patch: ${{ steps.ver.outputs.patch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: ver
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="$(awk '/^version:/{print $2; exit}' deploy/helm/efelant/Chart.yaml)"
          if [[ "${REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "expected x.y.z, got ${version}" >&2
            exit 1
          fi
          echo "patch=${version}" >> "${GITHUB_OUTPUT}"
          echo "minor=${version%.*}" >> "${GITHUB_OUTPUT}"
          echo "major=${version%%.*}" >> "${GITHUB_OUTPUT}"

  images:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            context: database
            file: database/Dockerfile
          - name: web-gateway
            context: database/web-gateway
            file: database/web-gateway/Dockerfile
          - name: web
            context: .
            file: app/Dockerfile
          - name: site
            context: site
            file: site/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.major }}
            type=raw,value=${{ needs.version.outputs.minor }}
            type=raw,value=${{ needs.version.outputs.patch }}
          labels: |
            org.opencontainers.image.title=efelant ${{ matrix.name }}
            org.opencontainers.image.description=The communication layer for PostgreSQL applications
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  charts:
    name: helm
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push chart
        env:
          VERSION: ${{ needs.version.outputs.patch }}
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/chart"
          mkdir -p "${dest}"
          helm package deploy/helm/efelant \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination "${dest}"
          helm push "${dest}/efelant-${VERSION}.tgz" \
            "oci://${REGISTRY}/${GITHUB_REPOSITORY}/charts"
