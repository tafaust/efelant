name: GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  version:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      major: ${{ steps.ver.outputs.major }}
      minor: ${{ steps.ver.outputs.minor }}
      patch: ${{ steps.ver.outputs.patch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ver
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="$(awk '/^version:/{print $2; exit}' deploy/helm/efelant/Chart.yaml)"
          if [[ "${REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "expected x.y.z, got ${version}" >&2
            exit 1
          fi
          echo "patch=${version}" >> "${GITHUB_OUTPUT}"
          echo "minor=${version%.*}" >> "${GITHUB_OUTPUT}"
          echo "major=${version%%.*}" >> "${GITHUB_OUTPUT}"

  images:
    name: ${{ matrix.name }}
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            context: database
            file: database/Dockerfile
          - name: web-gateway
            context: database/web-gateway
            file: database/web-gateway/Dockerfile
          - name: web
            context: .
            file: app/Dockerfile
          - name: site
            context: site
            file: site/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.major }}
            type=raw,value=${{ needs.version.outputs.minor }}
            type=raw,value=${{ needs.version.outputs.patch }}
          labels: |
            org.opencontainers.image.title=efelant ${{ matrix.name }}
            org.opencontainers.image.description=The communication layer for PostgreSQL applications
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  charts:
    name: helm
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push chart
        env:
          VERSION: ${{ needs.version.outputs.patch }}
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/chart"
          mkdir -p "${dest}"
          helm package deploy/helm/efelant \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination "${dest}"
          helm push "${dest}/efelant-${VERSION}.tgz" \
            "oci://${REGISTRY}/${GITHUB_REPOSITORY}/charts"
