{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "efelant.fullname" . }}-gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "efelant.name" . }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "efelant.name" . }}
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          ports:
            - containerPort: 5433
          env:
            - name: EFELANT_DB_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: EFELANT_DB_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: EFELANT_DB_NAME
              value: {{ .Values.postgres.database | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "efelant.fullname" . }}-gateway
spec:
  ports:
    - port: {{ .Values.gateway.servicePort }}
      targetPort: 5433
  selector:
    app.kubernetes.io/name: {{ include "efelant.name" . }}
    app.kubernetes.io/component: gateway
{{- end }}
