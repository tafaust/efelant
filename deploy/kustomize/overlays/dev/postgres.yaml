# Single-instance Postgres for k3s / kind. Not HA.
# Prod uses the stackgres component instead of this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: efelant-postgres
  labels:
    app.kubernetes.io/name: efelant
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: efelant
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: efelant
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: efelant-postgres:0.1.0
          ports:
            - containerPort: 5432
            - containerPort: 18080
              name: rest
            - containerPort: 18081
              name: grpc
          args:
            - postgres
            - -c
            - shared_preload_libraries=pg_cron,efelant_rest,efelant_grpc
            - -c
            - cron.database_name=efelant
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: efelant
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: efelant-postgres
                  key: password
            - name: EFELANT_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: efelant-postgres
                  key: app-password
            - name: EFELANT_SEED
              value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: efelant-postgres
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: rest
      port: 18080
      targetPort: 18080
    - name: grpc
      port: 18081
      targetPort: 18081
  selector:
    app.kubernetes.io/name: efelant
    app.kubernetes.io/component: postgres
