apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: efelant
resources:
  - ../../base
  - postgres.yaml
patches:
  - path: config-patch.yaml
images:
  - name: efelant-postgres
    newName: ghcr.io/tafaust/efelant/postgres
    newTag: "0.1.0"
namePrefix: ""
labels:
  - pairs:
      environment: dev
      app.kubernetes.io/part-of: efelant
    includeSelectors: false
