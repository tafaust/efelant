server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /health {
        proxy_pass http://web-gateway:5433/health;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://web-gateway:5433/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss: https://fonts.gstatic.com; worker-src 'self' blob:; frame-ancestors 'none'" always;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
        types {
            application/javascript js;
            application/json json;
            font/ttf ttf;
            font/otf otf;
            font/woff2 woff2;
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            image/svg+xml svg;
            text/plain txt;
        }
        try_files $uri =404;
    }
}
